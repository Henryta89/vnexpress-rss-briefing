name: Update VnExpress RSS Briefing

on:
  workflow_dispatch:

  schedule:
    # 08:37 Asia/Ho_Chi_Minh = 01:37 UTC
    - cron: "37 1 * * *"

permissions:
  contents: write

concurrency:
  group: vnexpress-rss-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch VnExpress RSS
        run: python3 fetch_vnexpress.py

      - name: Commit refreshed page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if git diff --cached --quiet; then
            echo "No page changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh VnExpress RSS briefing"
          git push
